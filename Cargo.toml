[package]
name = "zrax"
version = "0.1.0"
edition = "2021"
authors = ["ISA Harvester Team"]
description = "Zrax binary architecture classifier and browser analysis workbench"
license = "MIT OR Apache-2.0"
repository = "https://github.com/19h/zrax-isa-workbench"
keywords = ["binary", "isa", "architecture", "elf", "mach-o"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.70"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "zrax"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "zrax"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (only when building the binary)
clap = { version = "4.4", features = ["derive", "env"], optional = true }

# Logging (only when building the binary)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Binary parsing utilities
memchr = "2.7"

# Bit manipulation
bitflags = "2.4"

# Bounded decoders for compressed payloads (pure Rust, also built for WASM)
miniz_oxide = "0.8"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std"] }
sha2 = "0.11.0"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "frame"] }
ruzstd = "0.8"
bzip2 = "0.6"
lzfse_rust = "0.2"
brotli-decompressor = "5"

# Image4 AES payload trials (pure Rust, native and WASM), behind the
# "image4-aes" feature
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
ctr = { version = "0.9", optional = true }

# Hex display
hex = "0.4"

# X.509 certificate scanning, ported from cert-dump (pure Rust, native and
# WASM), behind the "certificates" feature. Never call `Validity::is_valid`:
# it reads the clock, which panics on wasm32-unknown-unknown and would make
# results time-dependent.
x509-parser = { version = "0.16", optional = true }
base64 = { version = "0.22", optional = true }

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
wide = { version = "0.7", optional = true }

# Batch processing (optional, behind "batch" feature)
rayon = { version = "1.12.0", optional = true }
crossbeam-channel = { version = "0.5.17", optional = true }
walkdir = { version = "2.5", optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
zstd = { version = "0.14.0", optional = true }
ratatui = { version = "^0.30", optional = true }
crossterm = { version = "^0.29", optional = true }
num_cpus = { version = "^1.17", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
criterion = "0.5"

[features]
default = ["cli"]
cli = [
    "certificates",
    "image4-aes",
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
]
# X.509 certificate scanning (src/certificates) and standalone certificate
# files as a format (src/formats/x509.rs). Without it a certificate file is
# not a recognized format: a PEM file is text and a DER file is raw input.
certificates = ["dep:x509-parser", "dep:base64"]
# AES-CBC and AES-CTR trials on Image4 payloads whose keybag holds a key and
# IV (src/image4.rs). Without it such a payload stays opaque.
image4-aes = ["dep:aes", "dep:cbc", "dep:ctr"]
batch = [
    "cli",
    "dep:rayon",
    "dep:crossbeam-channel",
    "dep:walkdir",
    "dep:chrono",
    "dep:zstd",
    "dep:ratatui",
    "dep:crossterm",
    "dep:num_cpus",
]
# Entropy, map and inspection engine shared by the browser and desktop
# workbenches (src/workbench).
workbench = ["certificates", "image4-aes", "dep:wide"]
wasm = ["workbench", "dep:wasm-bindgen"]
full-heuristics = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

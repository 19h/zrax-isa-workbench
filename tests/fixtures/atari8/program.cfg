# ld65 configuration for program.xex: an init segment at $0600 called
# through INITAD, the main program at $2E00 started through RUNAD.
MEMORY {
    ZP:   file = "", start = $0082, size = $007E;
    INIT: file = %O, start = $0600, size = $0100;
    MAIN: file = %O, start = $2E00, size = $1000;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start, initad = INIT: init;
}
SEGMENTS {
    INIT: load = INIT, type = ro;
    CODE: load = MAIN, type = ro;
}

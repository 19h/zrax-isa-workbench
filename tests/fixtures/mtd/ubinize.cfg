# ubinize volume layout for image.ubi (see README.md).

[rootfs]
mode=ubi
image=/work/rootfs-zstd.ubifs
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_size=640KiB

[kernel]
mode=ubi
image=/work/kernel.bin
vol_id=1
vol_type=static
vol_name=kernel

[data]
mode=ubi
vol_id=2
vol_type=dynamic
vol_name=data
vol_size=64KiB
